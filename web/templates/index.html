<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Deteksi CCTV - TA</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; text-align: center; margin: 0; padding: 20px; }
        h1 { color: #333; }
        .container { display: flex; justify-content: center; align-items: flex-start; gap: 20px; margin-top: 20px; flex-wrap: wrap; }
        .video-box { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .sidebar { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; text-align: left; }
        img { width: 100%; max-width: 640px; border-radius: 5px; }
        .alert-box { background: #ffdddd; border-left: 6px solid #f44336; padding: 10px; margin-top: 15px; }
    </style>
</head>
<body>

    <h1>Sistem Monitoring CCTV - Deteksi Tas Tertinggal</h1>
    
    <div class="container">
        <!-- Kotak Live Streaming CCTV -->
        <div class="video-box">
            <h3>Live CCTV Koridor Kampus</h3>
            <img src="{{ url_for('video_feed') }}" alt="CCTV Stream">
        </div>

        <!-- Panel Informasi / Status -->
        <div class="sidebar">
            <h3>Status Sistem</h3>
            <p><strong>Model:</strong> YOLOv8 (Bag & Person)</p>
            <p><strong>Kondisi:</strong> <span style="color: green; font-weight: bold;">Normal</span></p>
            
            <div class="alert-box">
                <strong>Log Peringatan:</strong>
                <p>Belum ada tas tertinggal yang terdeteksi dalam zona pantau.</p>
            </div>
        </div>
    </div>

</body>
</html>
